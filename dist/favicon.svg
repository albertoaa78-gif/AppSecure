<svg viewBox="0 0 200 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Escudo principal -->
  <defs>
    <linearGradient id="shieldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0e0e0;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Escudo de seguridad (forma tradicional) -->
  <path d="M 100 20 L 160 50 L 160 110 C 160 160 100 200 100 200 C 100 200 40 160 40 110 L 40 50 Z" 
        fill="url(#shieldGradient)" stroke="#333" stroke-width="3" filter="url(#shadow)"/>
  
  <!-- Símbolo de cerradura en el centro -->
  <g transform="translate(100, 110)">
    <!-- Círculo de fondo -->
    <circle cx="0" cy="0" r="35" fill="#0a0a0a" opacity="0.9"/>
    
    <!-- Cuerpo de cerradura -->
    <rect x="-12" y="-5" width="24" height="20" rx="3" fill="none" stroke="#ffffff" stroke-width="2.5"/>
    
    <!-- Cabeza de cerradura (semicírculo) -->
    <path d="M -18 -5 A 6 6 0 0 1 -6 -5" fill="none" stroke="#ffffff" stroke-width="2.5"/>
    <path d="M 6 -5 A 6 6 0 0 1 18 -5" fill="none" stroke="#ffffff" stroke-width="2.5"/>
    
    <!-- Punto de cerradura -->
    <circle cx="0" cy="0" r="2" fill="#ffffff"/>
    
    <!-- Línea decorativa inferior -->
    <line x1="-8" y1="18" x2="8" y2="18" stroke="#65a30d" stroke-width="1.5"/>
  </g>
  
  <!-- Detalles de seguridad en las esquinas del escudo -->
  <circle cx="55" cy="45" r="4" fill="#65a30d" opacity="0.7"/>
  <circle cx="145" cy="45" r="4" fill="#65a30d" opacity="0.7"/>
</svg>